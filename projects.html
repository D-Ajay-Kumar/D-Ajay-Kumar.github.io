<body>
  <div class="site-grid" aria-hidden="true"></div>

  <nav class="nav">
    <a href="index.html" class="nav__logo">DA<span class="nav__logo-dot">/</span></a>

    </div>

  <main class="projects-layout">
    <div class="section-head">
      <h2 class="section-title">Projects</h2>
      <p class="section-sub">AI applications, developer tools, and systems I build to learn and solve practical problems.</p>
    </div>
    <div id="projects-grid" class="projects-grid"></div>
  </main>

  <footer class="footer">
    <div class="footer__inner">
      <span>D Ajay Kumar</span>
      <span>·</span>
      <span>Built with static HTML &amp; a little magic</span>
    </div>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { PROJECTS } from "./js/main.js";
    const grid = document.getElementById("projects-grid");
    grid.innerHTML = PROJECTS.map((p) => `
      <div class="project-card">
        <div class="project-card__icon">${p.icon}</div>
        <h3 class="project-card__title">${p.title}</h3>
        <p class="project-card__desc">${p.desc}</p>
        <div class="project-card__tags">${p.tags.map((t) => `<span class="tag">${t}</span>`).join("")}</div>
        <div class="project-card__links">${p.links.map((l) => `<a href="${l.href}" target="_blank" rel="noopener noreferrer">${l.label}</a>`).join("")}</div>
      </div>`).join("");
  </script>
</body>
